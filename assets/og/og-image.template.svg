<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Open Graph template, "Hard Copy" system (design.md): yellow block, ink
    stroke, zero-blur offset shadows and the name set in Archivo Black.
    scripts/generate-og-image.sh replaces @@TECH@@, @@ROLE@@, @@SUBTITLE@@ and @@TAG@@
    once per locale (en → og-image.png, es → og-image-es.png).
  -->
  <rect width="1200" height="630" fill="#ffd93d"/>

  <!-- Marquee strip -->
  <rect width="1200" height="58" fill="#0d0d0d"/>
  <text x="40" y="37" font-family="JetBrains Mono" font-weight="500" font-size="20"
        letter-spacing="1.5" fill="#fffdf5">@@TECH@@</text>

  <!-- Role tag -->
  <rect x="66" y="104" width="470" height="44" fill="#0d0d0d"/>
  <rect x="60" y="98" width="470" height="44" fill="#0d0d0d"/>
  <text x="80" y="128" font-family="JetBrains Mono" font-weight="500" font-size="19"
        fill="#fffdf5">@@ROLE@@</text>

  <!-- Name -->
  <text x="54" y="290" font-family="Archivo Black" font-size="136" fill="#0d0d0d">GABRIEL</text>
  <text x="54" y="420" font-family="Archivo Black" font-size="136" fill="#0d0d0d">CASTILLO.</text>

  <!-- Subtitle -->
  <text x="60" y="520" font-family="Space Grotesk" font-weight="500" font-size="30"
        fill="#0d0d0d">@@SUBTITLE@@</text>
  <text x="60" y="566" font-family="JetBrains Mono" font-weight="500" font-size="20"
        fill="#0d0d0d">gabo8191.github.io/portfolio</text>

  <!-- Stickers -->
  <g transform="rotate(-6 1010 215)">
    <rect x="866" y="188" width="300" height="62" fill="#0d0d0d" transform="translate(7 7)"/>
    <rect x="866" y="188" width="300" height="62" fill="#ff6fb5" stroke="#0d0d0d" stroke-width="4"/>
    <text x="886" y="228" font-family="JetBrains Mono" font-weight="500" font-size="22"
          fill="#0d0d0d">MT103 → pacs.008</text>
  </g>
  <g transform="rotate(5 1010 305)">
    <rect x="866" y="282" width="300" height="56" fill="#0d0d0d" transform="translate(7 7)"/>
    <rect x="866" y="282" width="300" height="56" fill="#2f5bff" stroke="#0d0d0d" stroke-width="4"/>
    <text x="884" y="318" font-family="JetBrains Mono" font-weight="500" font-size="20"
          fill="#fffdf5">@@TAG@@</text>
  </g>

  <!-- Frame -->
  <rect x="2" y="2" width="1196" height="626" fill="none" stroke="#0d0d0d" stroke-width="4"/>
</svg>
